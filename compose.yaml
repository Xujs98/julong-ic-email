name: julong-ic-email

services:
  app:
    image: "${JULONG_IMAGE:-docker.io/qq1371446705/julong-ic-email:latest}"
    pull_policy: always
    container_name: julong-ic-email
    restart: unless-stopped
    ports:
      - "${JULONG_BIND_IP:-127.0.0.1}:${JULONG_PORT:-8787}:8787"
      - "${JULONG_SMTP_BIND_IP:-0.0.0.0}:${JULONG_SMTP_PORT:-25}:2525"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      IPM_PUBLIC_BASE_URL: "${IPM_PUBLIC_BASE_URL:-}"
      IPM_API_KEY: "${IPM_API_KEY:-}"
      IPM_APPLE_ACCOUNT_API_KEY: "${IPM_APPLE_ACCOUNT_API_KEY:-}"
      IPM_DOMAIN_SMTP_ENABLED: "${IPM_DOMAIN_SMTP_ENABLED:-false}"
      IPM_DOMAIN_SMTP_HOST: "${IPM_DOMAIN_SMTP_HOST:-0.0.0.0}"
      IPM_DOMAIN_SMTP_PORT: "${IPM_DOMAIN_SMTP_PORT:-2525}"
      IPM_DOMAIN_SMTP_MAX_MESSAGE_BYTES: "${IPM_DOMAIN_SMTP_MAX_MESSAGE_BYTES:-10485760}"
      IPM_DOMAIN_SMTP_CERT_FILE: "${IPM_DOMAIN_SMTP_CERT_FILE:-/app/tls/fullchain.pem}"
      IPM_DOMAIN_SMTP_KEY_FILE: "${IPM_DOMAIN_SMTP_KEY_FILE:-/app/tls/privkey.pem}"
    volumes:
      - julong-data:/app/data
      # Keep certificates outside the repository so private keys are never committed.
      - "${JULONG_SMTP_TLS_DIR:-./tls}:/app/tls:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s

volumes:
  julong-data:
    name: julong-ic-email-data

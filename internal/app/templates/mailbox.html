<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>邮箱接码 - 矩龙邮箱</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (() => { const t=['mint','sky','graphite','sunset','violet','rose','forest','midnight','obsidian','aurora']; let v='sky'; try{v=localStorage.getItem('julong_mail_theme')||'sky'}catch(_){} document.documentElement.dataset.theme=t.includes(v)?v:'sky'; })();
  </script>
  <style>
    :root{color-scheme:light;--bg:#eef4fc;--panel:#fff;--card:#fff;--text:#0a1b35;--muted:#4f6488;--faint:#7c8fb0;--line:rgba(91,129,186,.22);--accent:#3b82f6;--accent2:#2563eb;--ok:#047857;--bad:#b91c1c;--soft:#eef4ff;--shadow:0 22px 70px rgba(37,99,235,.12)}
    :root[data-theme="mint"]{--bg:#eef9f7;--panel:#fff;--card:#fff;--text:#06251f;--muted:#4f7068;--faint:#82a59c;--line:rgba(19,184,166,.22);--accent:#13b8a6;--accent2:#0a9e8c;--soft:#e9fbf7;--shadow:0 22px 70px rgba(19,184,166,.12)}
    :root[data-theme="graphite"]{--bg:#f1f2f4;--panel:#fff;--card:#fff;--text:#14181f;--muted:#5b6675;--faint:#8a93a1;--line:rgba(90,96,108,.22);--accent:#64748b;--accent2:#475569;--soft:#f3f4f6;--shadow:0 22px 70px rgba(15,23,42,.12)}
    :root[data-theme="sunset"]{--bg:#fbf4ee;--panel:#fffdfb;--card:#fffdfb;--text:#2a1505;--muted:#7c5a3e;--faint:#ac8d72;--line:rgba(180,120,70,.2);--accent:#fb7338;--accent2:#ea580c;--soft:#fdf2e8;--shadow:0 22px 70px rgba(120,60,20,.14)}
    :root[data-theme="violet"]{--bg:#f4f2fb;--panel:#fff;--card:#fdfcff;--text:#190b33;--muted:#5d5478;--faint:#948db0;--line:rgba(124,108,160,.22);--accent:#7c6cf0;--accent2:#6d28d9;--soft:#f5f2fd;--shadow:0 22px 70px rgba(45,27,90,.14)}
    :root[data-theme="rose"]{--bg:#faf2f5;--panel:#fff;--card:#fffafc;--text:#2a0a18;--muted:#7d5060;--faint:#ad8693;--line:rgba(163,117,137,.22);--accent:#f43f6e;--accent2:#e11d62;--soft:#fdf3f7;--shadow:0 22px 70px rgba(72,16,40,.14)}
    :root[data-theme="forest"]{--bg:#eef4f0;--panel:#fff;--card:#fff;--text:#06251a;--muted:#4a6a5b;--faint:#7f9a8c;--line:rgba(96,140,118,.22);--accent:#10b981;--accent2:#047857;--soft:#eff8f2;--shadow:0 22px 70px rgba(6,37,26,.13)}
    :root[data-theme="midnight"]{color-scheme:dark;--bg:#0b1220;--panel:#161f33;--card:#1d2740;--text:#eaf0fb;--muted:#94a6c4;--faint:#6b7b99;--line:rgba(148,176,224,.18);--accent:#38bdf8;--accent2:#0ea5e9;--soft:#141d31;--shadow:0 22px 70px rgba(0,0,0,.5)}
    :root[data-theme="obsidian"]{color-scheme:dark;--bg:#0c0e12;--panel:#16181f;--card:#1c1f27;--text:#f2f4f8;--muted:#8b97a9;--faint:#5d6a7c;--line:rgba(168,184,210,.14);--accent:#22d3ee;--accent2:#06b6d4;--soft:#1a1e28;--shadow:0 22px 70px rgba(0,0,0,.56)}
    :root[data-theme="aurora"]{color-scheme:dark;--bg:#08161a;--panel:#102528;--card:#163133;--text:#e8f6f3;--muted:#84a8a4;--faint:#5f7f7d;--line:rgba(180,224,216,.16);--accent:#2dd4bf;--accent2:#14b8a6;--soft:#122a2c;--shadow:0 22px 70px rgba(0,0,0,.44)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--accent) 18%,transparent),transparent 35%),linear-gradient(145deg,var(--bg),color-mix(in srgb,var(--bg) 78%,var(--accent) 22%))}.wrap{width:min(1040px,calc(100% - 28px));margin:34px auto}.head,.card{border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:var(--shadow)}.head{padding:28px 30px;margin-bottom:16px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.brand{display:flex;gap:12px;align-items:center;font-weight:950;font-size:22px}.logo{width:42px;height:42px;display:block;object-fit:cover;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 18%,transparent)}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--faint)}.card{padding:24px;margin-bottom:16px}.latest{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.code{font-size:48px;line-height:1;font-weight:950;letter-spacing:.08em;color:var(--accent2)}.badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent2);font-weight:800;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:var(--text);background:var(--panel);font:inherit;font-weight:800;cursor:pointer}button.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}.messages-list{display:grid;gap:14px;margin-top:18px}.message{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--card) 96%,var(--soft) 4%)}.message-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:16px 18px}.message-title{min-width:0}.message h3{margin:0 0 5px;font-size:17px;line-height:1.4;overflow-wrap:anywhere}.message-kind{flex:0 0 auto}.body{white-space:pre-wrap;word-break:break-word;color:var(--muted);padding:0 18px 18px}.email-details{border-top:1px solid var(--line)}.email-details>summary{cursor:pointer;list-style:none;padding:12px 18px;color:var(--accent2);background:var(--soft);font-size:13px;font-weight:850}.email-details>summary::-webkit-details-marker{display:none}.email-details>summary::after{content:"展开";float:right;color:var(--faint);font-weight:700}.email-details[open]>summary::after{content:"收起"}.email-viewer{padding:12px;background:color-mix(in srgb,var(--soft) 58%,var(--panel) 42%)}.email-frame{display:block;width:100%;height:460px;border:1px solid var(--line);border-radius:12px;background:#fff}.email-security-note{display:flex;gap:8px;align-items:center;margin:0 0 9px;color:var(--faint);font-size:12px}.empty{text-align:center;padding:32px;color:var(--faint)}@media(max-width:640px){.head{display:block}.latest{grid-template-columns:1fr}.code{font-size:38px}.wrap{margin:16px auto}.card{padding:18px}.message-head{display:block}.message-kind{margin-top:8px}.email-frame{height:390px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head"><div><div class="brand"><img class="logo" src="/logo.png" alt=""><span>矩龙邮箱</span></div><div class="muted" id="email">正在读取邮箱…</div></div><div class="toolbar"><span class="badge" id="expiry">链接检查中</span><button onclick="loadData()">刷新</button></div></header>
    <section class="card latest"><div><div class="tiny">最新验证码</div><div class="code" id="code">—</div><div class="muted" id="codeMeta">等待邮件</div></div><div class="muted" id="count">0 封邮件</div></section>
    <section class="card"><div class="toolbar" style="justify-content:space-between"><div><strong>最近邮件</strong><div class="tiny">页面每 10 秒自动刷新，API 地址永不过期。</div></div><span class="tiny" id="updated">—</span></div><div id="messages" class="empty">正在读取…</div></section>
  </main>
  <script>
    const token = location.pathname.split('/').filter(Boolean).pop();
    let lastMessageFingerprint = '';
    let ttlSeconds = 0;
    let ttlMeasuredAt = Date.now();
    function formatTTL(seconds){let remaining=Math.max(0,Math.floor(Number(seconds)||0));if(remaining<=0)return'已过期';const d=Math.floor(remaining/86400);remaining%=86400;const h=Math.floor(remaining/3600);remaining%=3600;const m=Math.floor(remaining/60);const s=remaining%60;return`剩余 ${d}天 ${h}时 ${m}分 ${s}秒`}
    function setTTL(seconds){ttlSeconds=Math.max(0,Math.floor(Number(seconds)||0));ttlMeasuredAt=Date.now();renderTTL()}
    function renderTTL(){const elapsed=Math.floor((Date.now()-ttlMeasuredAt)/1000);document.getElementById('expiry').textContent=formatTTL(Math.max(0,ttlSeconds-elapsed))}
    function formatDateTime(value){if(!value)return'—';const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value);return date.toLocaleString('zh-CN',{hour12:false})}
    function looksLikeHTML(value){const text=String(value||'').trim().toLowerCase();return Boolean(text&&['<!doctype html','<html','<head','<body','<table','<style','<div','<p ','<p>','<span'].some(marker=>text.includes(marker)))}
    function cleanLegacyText(value,subject){let text=String(value||'');for(let i=0;i<4;i++){text=text.replace(/@font-face\s*\{[^{}]*\}/gi,' ').replace(/[^{}]{0,240}\{[^{}]*\}/g,' ')}text=text.replace(/(?:font|line-height|padding|margin|width|height|display|color|background|border|text-align|mso-[\w-]+|-webkit-[\w-]+)\s*:[^;]{0,240};/gi,' ');text=text.replace(/\s+/g,' ').trim();const title=String(subject||'').trim();if(title&&text.startsWith(title+' '+title))text=text.slice(title.length).trim();return text}
    function buildEmailDocument(source){
      const parser=new DOMParser();const doc=parser.parseFromString(String(source||''),'text/html');
      doc.querySelectorAll('script,noscript,iframe,frame,frameset,object,embed,applet,form,input,button,textarea,select,option,base,link,meta,video,audio,source,foreignObject').forEach(node=>node.remove());
      doc.querySelectorAll('*').forEach(node=>{for(const attr of [...node.attributes]){const name=attr.name.toLowerCase(),value=attr.value.trim().toLowerCase();if(name.startsWith('on')||['srcdoc','ping','action','formaction'].includes(name)){node.removeAttribute(attr.name);continue}if(['href','xlink:href'].includes(name)&&!value.startsWith('#'))node.removeAttribute(attr.name);if(['src','background','poster'].includes(name)&&!value.startsWith('data:image/'))node.removeAttribute(attr.name)}});
      const charset=doc.createElement('meta');charset.setAttribute('charset','utf-8');doc.head.prepend(charset);
      const csp=doc.createElement('meta');csp.setAttribute('http-equiv','Content-Security-Policy');csp.setAttribute('content',"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'");doc.head.prepend(csp);
      const style=doc.createElement('style');style.textContent='html,body{margin:0;padding:0;min-height:100%;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;overflow-wrap:anywhere}body{padding:18px}img,table{max-width:100%!important}img{height:auto!important}table{width:auto}pre{white-space:pre-wrap}';doc.head.appendChild(style);
      return '<!doctype html>'+doc.documentElement.outerHTML;
    }
    function renderMessages(messages){
      const fingerprint=JSON.stringify(messages.map(item=>[item.id,item.received_at,item.subject,(item.html_body||item.body||'').length]));if(fingerprint===lastMessageFingerprint)return;lastMessageFingerprint=fingerprint;
      const list=document.getElementById('messages');list.replaceChildren();list.className=messages.length?'messages-list':'empty';if(!messages.length){list.textContent='暂无邮件';return}
      messages.forEach((message,index)=>{const article=document.createElement('article');article.className='message';const head=document.createElement('div');head.className='message-head';const titleBox=document.createElement('div');titleBox.className='message-title';const title=document.createElement('h3');title.textContent=message.subject||'(无主题)';const meta=document.createElement('div');meta.className='tiny';meta.textContent=`${message.from||'未知发件人'} · ${formatDateTime(message.received_at)}`;titleBox.append(title,meta);const htmlSource=message.html_body||(looksLikeHTML(message.body)?message.body:'');const kind=document.createElement('span');kind.className='badge message-kind';kind.textContent=htmlSource?'HTML 邮件':'纯文本';head.append(titleBox,kind);article.appendChild(head);
        if(htmlSource){const details=document.createElement('details');details.className='email-details';details.open=index===0;const summary=document.createElement('summary');summary.textContent='可视化邮件内容';const viewer=document.createElement('div');viewer.className='email-viewer';const note=document.createElement('div');note.className='email-security-note';note.textContent='隔离预览 · 脚本、表单和外部资源已拦截';const frame=document.createElement('iframe');frame.className='email-frame';frame.title=`${message.subject||'邮件'} 可视化内容`;frame.setAttribute('sandbox','');frame.setAttribute('referrerpolicy','no-referrer');frame.setAttribute('loading','lazy');let mounted=false;const mount=()=>{if(!mounted){frame.srcdoc=buildEmailDocument(htmlSource);mounted=true}};details.addEventListener('toggle',()=>{if(details.open)mount()});viewer.append(note,frame);details.append(summary,viewer);article.appendChild(details);if(details.open)mount()}else{const body=document.createElement('div');body.className='body';body.textContent=cleanLegacyText(message.body,message.subject)||'（邮件正文为空）';article.appendChild(body)}list.appendChild(article)});
    }
    async function loadData(){
      try{const res=await fetch(`/mailbox/${encodeURIComponent(token)}/data`,{cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.message||'链接已过期');
        document.getElementById('email').textContent=data.mailbox.email||'—';document.getElementById('count').textContent=`${data.messages.length} 封邮件`;setTTL(data.ttl_seconds);document.getElementById('updated').textContent=new Date().toLocaleTimeString();
        const latest=data.latest||{};document.getElementById('code').textContent=latest.code||'—';document.getElementById('codeMeta').textContent=latest.code?`${latest.subject||'验证码邮件'} · ${formatDateTime(latest.received_at)}`:'暂未识别到验证码';renderMessages(data.messages||[]);
      }catch(err){setTTL(0);document.getElementById('messages').className='empty';document.getElementById('messages').textContent=err.message||'链接已过期';}
    }
    loadData();setInterval(renderTTL,1000);setInterval(loadData,10000);
  </script>
</body>
</html>

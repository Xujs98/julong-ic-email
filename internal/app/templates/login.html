<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 矩龙邮箱</title>
  <script>
    (() => {
      const themes = ['mint','sky','graphite','sunset','violet','rose','forest','midnight','obsidian','aurora'];
      let theme = 'sky';
      try { theme = localStorage.getItem('julong_mail_theme') || 'sky'; } catch (_) {}
      document.documentElement.dataset.theme = themes.includes(theme) ? theme : 'sky';
    })();
  </script>
  <style>
    :root { --bg:#eef8f6; --panel:#fff; --line:rgba(118,143,174,.25); --text:#061637; --muted:#4e6483; --green:#13b8a6; --red:#dc2626; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 12% 10%,rgba(19,184,166,.18),transparent 30%),linear-gradient(180deg,#f8fbff,#eef8f6); }
    .wrap { width:min(980px, calc(100% - 32px)); display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:stretch; }
    .hero, .card { border:1px solid var(--line); border-radius:24px; background:rgba(255,255,255,.9); box-shadow:0 28px 90px rgba(17,70,101,.12); }
    .hero { padding:36px; display:flex; flex-direction:column; justify-content:center; }
    .eyebrow { color:#059b87; font-size:12px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:10px 0 12px; font-size:36px; letter-spacing:-.04em; }
    p { color:var(--muted); line-height:1.7; margin:0; }
    .card { padding:22px; }
    .tabs { display:flex; gap:10px; margin-bottom:16px; }
    button { border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text); padding:11px 14px; cursor:pointer; font-weight:800; }
    button.active, button.primary { border-color:transparent; background:linear-gradient(135deg,#13b8a6,#17c9ae); color:#fff; }
    label { display:flex; flex-direction:column; gap:7px; color:var(--muted); font-size:12px; font-weight:800; margin:12px 0; }
    input { border:1px solid var(--line); border-radius:12px; padding:12px; outline:none; font:inherit; }
    input:focus { border-color:rgba(19,184,166,.62); box-shadow:0 0 0 4px rgba(19,184,166,.12); }
    .actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
    .notice { margin-top:14px; padding:12px; border-radius:14px; background:#ecfdf5; color:#0f766e; white-space:pre-wrap; line-height:1.6; }
    .notice[hidden] { display:none; }
    .notice.err { background:#fff5f5; color:#b91c1c; }
    @media (max-width:820px){ .wrap{grid-template-columns:1fr;} h1{font-size:30px;} }

    :root {
      color-scheme: light;
      --surface-rgb: 255 255 255;
      --bg: #f3f7f9;
      --bg-soft: #f8fbfb;
      --panel: #ffffff;
      --panel-2: #f4f8fa;
      --card: #ffffff;
      --ink: #101828;
      --ink-soft: #1f314e;
      --text: #07182f;
      --muted: #51677f;
      --faint: #8492a6;
      --line: rgba(117, 133, 163, .22);
      --line-strong: rgba(117, 133, 163, .38);
      --green: #13b8a6;
      --green-2: #0a9e8c;
      --on-accent: #ffffff;
      --amber: #b7791f;
      --red: #dc2626;
      --count-bg: #e7eef5;
      --th-bg: #f3f9fb;
      --log-bg: #f4f8fa;
      --log-ink: #334155;
      --ok: #047857;
      --ok-soft: rgba(209, 250, 229, .72);
      --ok-line: rgba(16, 185, 129, .26);
      --warn: #a16207;
      --warn-soft: #fff7e6;
      --warn-line: rgba(180, 83, 9, .24);
      --bad: #b91c1c;
      --bad-soft: #fff1f1;
      --bad-line: rgba(220, 38, 38, .22);
      --shadow: 0 14px 36px rgba(16, 24, 40, .06);
      --shadow-strong: 0 28px 72px rgba(16, 24, 40, .12);
      --focus-ring: rgba(19, 184, 166, .16);
      --soft-glass: rgb(var(--surface-rgb) / .68);
      --glass: rgb(var(--surface-rgb) / .56);
      --glass-strong: rgb(var(--surface-rgb) / .92);
      --glass-soft: rgb(var(--surface-rgb) / .5);
      --glass-hi: rgb(var(--surface-rgb) / .72);
      --glass-line: rgb(var(--surface-rgb) / .62);
      --sidebar-bg: rgb(var(--surface-rgb) / .9);
      --head-bg: rgb(var(--surface-rgb) / .86);
      --input-bg: rgb(var(--surface-rgb) / .9);
    }
    :root[data-theme="sky"] {
      --surface-rgb: 255 255 255;
      --bg: #eef4fc; --bg-soft: #f6faff; --panel: #ffffff; --card: #ffffff;
      --text: #0a1b35; --ink: #0f1f3d; --ink-soft: #243b63; --muted: #4f6488; --faint: #7c8fb0;
      --line: rgba(91, 129, 186, .22); --line-strong: rgba(91, 129, 186, .38);
      --green: #3b82f6; --green-2: #2563eb; --on-accent: #ffffff;
      --count-bg: #e4ecfb; --th-bg: #eef4ff; --log-bg: #f1f6fe; --log-ink: #33415a;
      --ok: #047857; --ok-soft: rgba(209, 250, 229, .72); --ok-line: rgba(16, 185, 129, .26);
      --warn: #a16207; --warn-soft: #fff7e6; --warn-line: rgba(180, 83, 9, .24);
      --bad: #b91c1c; --bad-soft: #fff1f1; --bad-line: rgba(220, 38, 38, .22);
      --shadow: 0 16px 42px rgba(37, 99, 235, .08); --shadow-strong: 0 30px 78px rgba(37, 99, 235, .15);
      --focus-ring: rgba(37, 99, 235, .16);
    }
    :root[data-theme="graphite"] {
      --surface-rgb: 255 255 255;
      --bg: #f1f2f4; --bg-soft: #f8f9fa; --panel: #ffffff; --card: #ffffff;
      --text: #14181f; --ink: #1a1f27; --ink-soft: #313a47; --muted: #5b6675; --faint: #8a93a1;
      --line: rgba(90, 96, 108, .22); --line-strong: rgba(90, 96, 108, .38);
      --green: #64748b; --green-2: #475569; --on-accent: #ffffff;
      --count-bg: #e9ebef; --th-bg: #f3f4f6; --log-bg: #f3f4f6; --log-ink: #313a47;
      --ok: #047857; --ok-soft: rgba(209, 250, 229, .72); --ok-line: rgba(16, 185, 129, .26);
      --warn: #a16207; --warn-soft: #fff7e6; --warn-line: rgba(180, 83, 9, .24);
      --bad: #b91c1c; --bad-soft: #fff1f1; --bad-line: rgba(220, 38, 38, .22);
      --shadow: 0 14px 38px rgba(15, 23, 42, .07); --shadow-strong: 0 28px 70px rgba(15, 23, 42, .14);
      --focus-ring: rgba(71, 85, 105, .16);
    }
    :root[data-theme="sunset"] {
      --surface-rgb: 255 252 249;
      --bg: #fbf4ee; --bg-soft: #fef9f4; --panel: #fffdfb; --card: #fffdfb;
      --text: #2a1505; --ink: #2e1a0a; --ink-soft: #4a2f18; --muted: #7c5a3e; --faint: #ac8d72;
      --line: rgba(180, 120, 70, .20); --line-strong: rgba(180, 120, 70, .36);
      --green: #fb7338; --green-2: #ea580c; --on-accent: #ffffff;
      --count-bg: #f7e7d8; --th-bg: #fdf2e8; --log-bg: #fbf3eb; --log-ink: #5a4633;
      --ok: #047857; --ok-soft: rgba(209, 250, 229, .66); --ok-line: rgba(16, 185, 129, .26);
      --warn: #b45309; --warn-soft: rgba(255, 237, 213, .78); --warn-line: rgba(180, 83, 9, .26);
      --bad: #c0341d; --bad-soft: rgba(255, 235, 228, .82); --bad-line: rgba(220, 60, 38, .24);
      --shadow: 0 14px 36px rgba(120, 60, 20, .08); --shadow-strong: 0 28px 72px rgba(120, 60, 20, .16);
      --focus-ring: rgba(251, 115, 56, .18);
    }
    :root[data-theme="violet"] {
      --surface-rgb: 252 251 255;
      --bg: #f4f2fb; --bg-soft: #faf8ff; --panel: #ffffff; --card: #fdfcff;
      --text: #190b33; --ink: #1a1330; --ink-soft: #2c2350; --muted: #5d5478; --faint: #948db0;
      --line: rgba(124, 108, 160, .22); --line-strong: rgba(124, 108, 160, .38);
      --green: #7c6cf0; --green-2: #6d28d9; --on-accent: #ffffff;
      --count-bg: #ece8f8; --th-bg: #f5f2fd; --log-bg: #f6f3fc; --log-ink: #3a3357;
      --ok: #047857; --ok-soft: rgba(209, 250, 229, .72); --ok-line: rgba(16, 185, 129, .26);
      --warn: #a16207; --warn-soft: #fff7e6; --warn-line: rgba(180, 83, 9, .24);
      --bad: #b91c1c; --bad-soft: #fff1f1; --bad-line: rgba(220, 38, 38, .22);
      --shadow: 0 14px 36px rgba(45, 27, 90, .08); --shadow-strong: 0 28px 72px rgba(45, 27, 90, .16);
      --focus-ring: rgba(124, 108, 160, .20);
    }
    :root[data-theme="rose"] {
      --surface-rgb: 255 251 252;
      --bg: #faf2f5; --bg-soft: #fef7f9; --panel: #ffffff; --card: #fffafc;
      --text: #2a0a18; --ink: #2e1020; --ink-soft: #4d1f37; --muted: #7d5060; --faint: #ad8693;
      --line: rgba(163, 117, 137, .22); --line-strong: rgba(163, 117, 137, .40);
      --green: #f43f6e; --green-2: #e11d62; --on-accent: #ffffff;
      --count-bg: #f7e7ee; --th-bg: #fdf3f7; --log-bg: #fbf4f7; --log-ink: #4d3543;
      --ok: #047857; --ok-soft: rgba(209, 250, 229, .72); --ok-line: rgba(16, 185, 129, .26);
      --warn: #a16207; --warn-soft: #fff7e6; --warn-line: rgba(180, 83, 9, .24);
      --bad: #b91c1c; --bad-soft: #fff1f1; --bad-line: rgba(220, 38, 38, .22);
      --shadow: 0 14px 36px rgba(72, 16, 40, .07); --shadow-strong: 0 28px 72px rgba(72, 16, 40, .14);
      --focus-ring: rgba(225, 29, 98, .18);
    }
    :root[data-theme="forest"] {
      --surface-rgb: 251 254 252;
      --bg: #eef4f0; --bg-soft: #f4faf6; --panel: #ffffff; --card: #ffffff;
      --text: #06251a; --ink: #0d2a1f; --ink-soft: #1d4234; --muted: #4a6a5b; --faint: #7f9a8c;
      --line: rgba(96, 140, 118, .22); --line-strong: rgba(96, 140, 118, .38);
      --green: #10b981; --green-2: #047857; --on-accent: #ffffff;
      --count-bg: #e4efe8; --th-bg: #eff8f2; --log-bg: #f1f7f3; --log-ink: #2f4a3d;
      --ok: #047857; --ok-soft: rgba(209, 250, 229, .72); --ok-line: rgba(16, 185, 129, .26);
      --warn: #a16207; --warn-soft: #fff7e6; --warn-line: rgba(180, 83, 9, .24);
      --bad: #b91c1c; --bad-soft: #fff1f1; --bad-line: rgba(220, 38, 38, .22);
      --shadow: 0 14px 36px rgba(6, 37, 26, .07); --shadow-strong: 0 28px 72px rgba(6, 37, 26, .13);
      --focus-ring: rgba(16, 185, 129, .16);
    }
    :root[data-theme="midnight"] {
      color-scheme: dark;
      --surface-rgb: 44 56 82;
      --bg: #0b1220; --bg-soft: #0f1830; --panel: #161f33; --card: #1d2740;
      --text: #eaf0fb; --ink: #dde6f6; --ink-soft: #c2cfe6; --muted: #94a6c4; --faint: #6b7b99;
      --line: rgba(148, 176, 224, .18); --line-strong: rgba(148, 176, 224, .34); --glass-line: rgba(186, 210, 248, .14);
      --green: #38bdf8; --green-2: #0ea5e9; --on-accent: #06223a;
      --count-bg: #1c2742; --th-bg: #141d31; --log-bg: #0e1729; --log-ink: #aebfd9;
      --ok: #34d399; --ok-soft: rgba(16, 185, 129, .16); --ok-line: rgba(52, 211, 153, .30);
      --warn: #fbbf24; --warn-soft: rgba(245, 158, 11, .16); --warn-line: rgba(251, 191, 36, .30);
      --bad: #f87171; --bad-soft: rgba(239, 68, 68, .16); --bad-line: rgba(248, 113, 113, .30);
      --shadow: 0 14px 36px rgba(0, 0, 0, .5); --shadow-strong: 0 28px 72px rgba(0, 0, 0, .62);
      --focus-ring: rgba(56, 189, 248, .32);
    }
    :root[data-theme="obsidian"] {
      color-scheme: dark;
      --surface-rgb: 48 53 64;
      --bg: #0c0e12; --bg-soft: #111420; --panel: #16181f; --card: #1c1f27;
      --text: #f2f4f8; --ink: #e6eaf2; --ink-soft: #c2c9d6; --muted: #8b97a9; --faint: #5d6a7c;
      --line: rgba(168, 184, 210, .14); --line-strong: rgba(168, 184, 210, .26); --glass-line: rgba(200, 212, 232, .10);
      --green: #22d3ee; --green-2: #06b6d4; --on-accent: #062a32;
      --count-bg: #232735; --th-bg: #1a1e28; --log-bg: #0e1117; --log-ink: #aeb8c8;
      --ok: #34d399; --ok-soft: rgba(16, 185, 129, .14); --ok-line: rgba(52, 211, 153, .30);
      --warn: #fbbf24; --warn-soft: rgba(245, 158, 11, .14); --warn-line: rgba(251, 191, 36, .30);
      --bad: #f87171; --bad-soft: rgba(239, 68, 68, .14); --bad-line: rgba(248, 113, 113, .32);
      --shadow: 0 14px 36px rgba(0, 0, 0, .55); --shadow-strong: 0 28px 72px rgba(0, 0, 0, .68);
      --focus-ring: rgba(34, 211, 238, .30);
    }
    :root[data-theme="aurora"] {
      color-scheme: dark;
      --surface-rgb: 40 60 64;
      --bg: #08161a; --bg-soft: #0c1f22; --panel: #102528; --card: #163133;
      --text: #e8f6f3; --ink: #d3ebe6; --ink-soft: #aecfca; --muted: #84a8a4; --faint: #5f7f7d;
      --line: rgba(180, 224, 216, .16); --line-strong: rgba(180, 224, 216, .30); --glass-line: rgba(180, 224, 216, .14);
      --green: #2dd4bf; --green-2: #14b8a6; --on-accent: #04201b;
      --count-bg: #15302f; --th-bg: #122a2c; --log-bg: #0a1c1e; --log-ink: #9cc4bf;
      --ok: #34d399; --ok-soft: rgba(16, 185, 129, .16); --ok-line: rgba(52, 211, 153, .30);
      --warn: #fbbf24; --warn-soft: rgba(180, 120, 9, .16); --warn-line: rgba(251, 191, 36, .28);
      --bad: #fb7185; --bad-soft: rgba(220, 38, 38, .16); --bad-line: rgba(251, 113, 133, .30);
      --shadow: 0 14px 36px rgba(0, 0, 0, .42); --shadow-strong: 0 28px 72px rgba(0, 0, 0, .5);
      --focus-ring: rgba(45, 212, 191, .30);
    }
    :root { --green-dark: var(--green-2); --red: var(--bad); }

    /* 矩龙邮箱登录页 / theme-aware */
    body {
      color: var(--text);
      background: radial-gradient(circle at 74% 14%, color-mix(in srgb, var(--green) 22%, transparent), transparent 32%), linear-gradient(135deg, var(--bg-soft), var(--bg) 55%, color-mix(in srgb, var(--bg) 88%, var(--green) 12%));
    }
    .wrap { width:min(1040px,calc(100% - 36px)); gap:0; border:1px solid var(--line); border-radius:28px; overflow:hidden; color:var(--text); background:color-mix(in srgb,var(--panel) 95%,transparent); box-shadow:var(--shadow-strong); }
    .hero,.card { border:0; border-radius:0; color:var(--text); background:var(--panel); box-shadow:none; }
    .hero { min-height:500px; padding:52px; background:linear-gradient(145deg,color-mix(in srgb,var(--bg-soft) 90%,var(--green) 10%),var(--panel)); }
    .card { padding:52px 46px; display:flex; flex-direction:column; justify-content:center; }
    .login-brand { display:flex; align-items:center; gap:14px; color:var(--text); font-size:26px; font-weight:950; }
    .brand-logo { width:50px; height:50px; display:grid; place-items:center; border-radius:15px; color:var(--on-accent); background:linear-gradient(135deg,var(--green),var(--green-2)); box-shadow:0 12px 26px color-mix(in srgb,var(--green) 24%,transparent); }
    .eyebrow { color:var(--green-2); letter-spacing:.18em; margin-bottom:18px; }
    h1 { color:var(--text); font-size:42px; margin-top:38px; }
    p,label { color:var(--muted); }
    .tabs { padding:5px; border:1px solid var(--line); border-radius:14px; background:var(--th-bg); }
    .tabs button { flex:1; border:0; color:var(--muted); background:transparent; }
    button { border-color:var(--line); color:var(--text); background:var(--panel); }
    button.active,button.primary { color:var(--on-accent); background:linear-gradient(135deg,var(--green),var(--green-2)); box-shadow:0 10px 22px color-mix(in srgb,var(--green) 22%,transparent); }
    input { min-height:48px; border-color:var(--line); color:var(--text); background:var(--input-bg); }
    input::placeholder { color:var(--faint); }
    input:focus { border-color:var(--green); box-shadow:0 0 0 4px var(--focus-ring); }
    .actions .primary { width:100%; min-height:48px; }
    .notice { color:var(--ok); border:1px solid var(--ok-line); background:var(--ok-soft); }
    .notice.err { color:var(--bad); border-color:var(--bad-line); background:var(--bad-soft); }
    @media(max-width:820px){.hero{min-height:auto;padding:34px}.card{padding:34px}.wrap{grid-template-columns:1fr}.hero h1{font-size:34px;margin-top:26px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">JULONG MAIL</div>
      <div class="login-brand"><span class="brand-logo">✦</span><span>矩龙邮箱</span></div>
      <h1>欢迎回来</h1>
      <p>登录后统一管理 iCloud 隐私邮箱、收件与取件码。</p>
    </section>
    <section class="card">
      <div class="tabs">
        <button id="loginTab" class="active" onclick="switchMode('login')">登录</button>
        <button id="registerTab" onclick="switchMode('register')">注册</button>
      </div>
      <label>账号<input id="username" autocomplete="username" placeholder="例如 admin 或 user@example.com"></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位"></label>
      <div class="actions">
        <button class="primary" id="submitButton" onclick="submitAuth()">登录</button>
      </div>
      <div class="notice" id="notice" hidden></div>
    </section>
  </main>
  <script>
    let mode = 'login';
    const $ = id => document.getElementById(id);
    function switchMode(next) {
      if (next === 'register' && !registrationEnabled) {
        setNotice('当前未开放注册，请联系管理员。', true);
        return;
      }
      mode = next;
      $('loginTab').classList.toggle('active', mode === 'login');
      $('registerTab').classList.toggle('active', mode === 'register');
      $('submitButton').textContent = mode === 'login' ? '登录' : '注册并登录';
      clearNotice();
    }
    let registrationEnabled = true;
    function setNotice(text, isErr=false) {
      $('notice').textContent = text;
      $('notice').classList.toggle('err', isErr);
      $('notice').hidden = !text;
    }
    function clearNotice() {
      setNotice('');
    }
    async function submitAuth() {
      const username = $('username').value.trim();
      const password = $('password').value;
      if (!username || !password) {
        setNotice('账号和密码不能为空', true);
        return;
      }
      $('submitButton').disabled = true;
      try {
        const res = await fetch(mode === 'login' ? '/api/auth/login' : '/api/auth/register', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'content-type':'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || data.code || `HTTP ${res.status}`);
        setNotice(`${mode === 'login' ? '登录' : '注册'}成功：${data.user.username}${data.user.is_admin ? ' / 管理员' : ''}`);
        location.href = '/';
      } catch (err) {
        setNotice(err.message, true);
      } finally {
        $('submitButton').disabled = false;
      }
    }
    fetch('/api/auth/register-status', {credentials:'same-origin'})
      .then(r => r.json())
      .then(data => {
        registrationEnabled = data.registration_enabled !== false;
        if (!registrationEnabled) {
          $('registerTab').disabled = true;
          $('registerTab').title = '当前未开放注册';
        }
      }).catch(() => {});
    fetch('/api/auth/me', {credentials:'same-origin'})
      .then(r => r.json())
      .then(data => { if (data.authenticated) location.href = '/'; })
      .catch(() => {});
  </script>
</body>
</html>
